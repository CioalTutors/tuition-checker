<!DOCTYPE:html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CioalTutors Status Checker</title>
    <!-- Load Tailwind CSS --><script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Custom Theme Colors inspired by the logo */
        :root {
            --color-primary-green: #52c41a; /* EXACT COLOR MATCH: #52c41a provided by the user */
            --color-dark-green: #44a516; /* Darker shade for borders/details */
            --color-light-green: #e9f5e1;
        }

        /* Custom scrollbar styling for the dropdown (optional, but nice) */
        .custom-select::-webkit-scrollbar {
            width: 8px;
        }
        .custom-select::-webkit-scrollbar-thumb {
            background-color: var(--color-dark-green);
            border-radius: 10px;
        }
        .custom-select::-webkit-scrollbar-track {
            background: var(--color-light-green);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
        }

        .header-bg {
            background-color: var(--color-primary-green);
            box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.15);
        }

        .primary-text {
            color: var(--color-primary-green);
        }

        .primary-bg {
            background-color: var(--color-primary-green);
        }
        
        /* Loading spinner animation, adapted for white background */
        .spinner {
            border: 4px solid #e5e7eb; /* light gray base */
            border-top: 4px solid var(--color-primary-green); /* Primary green animated part */
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- Main Container --><div class="w-full max-w-md bg-white rounded-xl shadow-2xl overflow-hidden mt-8 md:mt-16">

        <!-- Header/Logo Section (Background color removed here) --><header class="p-0 flex flex-col items-center justify-center rounded-t-xl">
            <!-- Logo Section: Now full width and fills the top space --><img id="logo" 
                src="https://i.ibb.co/YFKnnBj8/Cioal-Tutors-Banner.png" 
                alt="CioalTutors Logo" 
                class="w-full h-auto"
                onerror="this.outerHTML='<div id=\'logo-placeholder\' class=\'w-full py-4 bg-[var(--color-dark-green)] shadow-lg\'><span class=\'text-white text-xl font-bold tracking-wider\'>CioalTutors</span></div>';"
            >
            <!-- Title moved below the logo, text color changed to dark gray --><h1 class="text-gray-800 text-2xl font-extrabold pt-4 pb-6 px-6 text-center">Tuition Status Lookup</h1>
        </header>

        <!-- Main Content Area --><main class="p-6">
            <!-- Loading State --><div id="loadingState" class="flex flex-col items-center justify-center p-8 text-gray-700">
                <div class="spinner"></div>
                <p class="mt-4 font-semibold text-lg">Loading tuition data...</p>
            </div>

            <!-- Application Content (Initially Hidden) --><div id="appContent" class="hidden">
                <label for="tuitionSelect" class="block text-lg font-medium text-gray-800 mb-3">Select Tuition Number:</label>
                
                <select id="tuitionSelect" 
                        class="custom-select mt-1 block w-full pl-3 pr-10 py-3 text-base border-gray-300 focus:outline-none focus:ring-4 focus:ring-[var(--color-primary-green)] focus:border-[var(--color-primary-green)] sm:text-lg rounded-xl shadow-lg border-2 transition duration-150 ease-in-out">
                    <option value="">-- Please Select --</option>
                </select>

                <!-- Status Display --><div class="mt-10 p-5 rounded-xl border-l-8 border-[var(--color-dark-green)] shadow-xl bg-gray-50" id="statusContainer">
                    <p class="text-md font-semibold text-gray-500 uppercase tracking-wider">Current Auto Status:</p>
                    <p class="text-3xl font-extrabold primary-text mt-2 transition duration-300" id="statusDisplay">Awaiting Selection...</p>
                </div>
            </div>

            <!-- Error State (Initially Hidden) --><div id="errorState" class="hidden text-center p-8">
                <p class="text-red-600 font-bold text-xl">Data Load Error</p>
                <p class="text-sm text-gray-600 mt-3">We couldn't fetch the data from the Google Sheet. Please check the provided URL.</p>
            </div>
        </main>
    </div>

    <script>
        // Constants
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTfIb0otzFTzedtVI6ad2Dsqp5PMMcU74q6PMlCPoyxengcTujUfdGj1emWbBRh-lA3Awouxcbgo86o/pub?gid=0&single=true&output=csv';

        // DOM Elements
        const tuitionSelect = document.getElementById('tuitionSelect');
        const statusDisplay = document.getElementById('statusDisplay');
        const loadingState = document.getElementById('loadingState');
        const appContent = document.getElementById('appContent');
        const errorState = document.getElementById('errorState');
        const statusContainer = document.getElementById('statusContainer');

        let tuitionData = []; // Global array to hold the parsed data

        // --- Utility Functions ---

        /**
         * Parses the CSV text into an array of objects.
         * Assumes the first row is the header.
         * @param {string} csvText - The raw CSV string.
         * @returns {Array<Object>} The parsed data.
         */
        function parseCsv(csvText) {
            // Split by line and filter out empty lines
            const lines = csvText.trim().split('\n').filter(line => line.length > 0);
            if (lines.length === 0) return [];

            // Get headers (first line)
            // Note: Simple split(',') might break if data contains commas, but is generally safe for simple public Google Sheets CSVs.
            const headers = lines[0].split(',').map(header => header.trim().replace(/"/g, ''));

            const data = [];
            // Process remaining lines (data rows)
            for (let i = 1; i < lines.length; i++) {
                // Split the line by commas, treating quoted fields as single entries
                const values = lines[i].match(/(".*?"|[^",\r\n]+)(?=\s*,|\s*$)/g) || [];
                
                const rowObject = {};
                for (let j = 0; j < headers.length && j < values.length; j++) {
                    // Clean up potential quotes from values
                    rowObject[headers[j]] = values[j].trim().replace(/^"|"$/g, '');
                }
                data.push(rowObject);
            }
            return data;
        }

        /**
         * Fetches CSV data from the URL and initializes the application.
         */
        async function initApp() {
            loadingState.classList.remove('hidden');
            appContent.classList.add('hidden');
            errorState.classList.add('hidden');

            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const csvText = await response.text();
                
                // Parse the data
                tuitionData = parseCsv(csvText);
                
                if (tuitionData.length === 0) {
                     throw new Error("No data found or CSV is empty.");
                }

                // Assuming the relevant columns are named exactly 'Tuition Number' and 'Status'
                const tuitionNumbers = tuitionData.map(item => item['Tuition Number']).filter(num => num);

                populateDropdown(tuitionNumbers);

                // Setup listener after data is loaded
                tuitionSelect.addEventListener('change', updateStatus);
                
                // Switch to app content view
                loadingState.classList.add('hidden');
                appContent.classList.remove('hidden');

            } catch (error) {
                console.error('Failed to load or process data:', error);
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
            }
        }

        /**
         * Populates the dropdown menu with unique tuition numbers.
         * @param {Array<string>} numbers - Array of tuition number strings.
         */
        function populateDropdown(numbers) {
            // Create a Set to ensure unique values
            const uniqueNumbers = [...new Set(numbers)].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

            // Clear any existing options (except the initial placeholder)
            while (tuitionSelect.options.length > 1) {
                tuitionSelect.remove(1);
            }

            uniqueNumbers.forEach(number => {
                const option = document.createElement('option');
                option.value = number;
                option.textContent = number;
                tuitionSelect.appendChild(option);
            });
        }

        /**
         * Updates the status display based on the selected tuition number.
         */
        function updateStatus() {
            const selectedNumber = tuitionSelect.value;
            statusDisplay.textContent = 'Searching...';
            // Reset status container classes
            statusContainer.classList.remove('bg-red-50', 'border-red-600', 'bg-yellow-50', 'border-yellow-600', 'bg-green-50', 'border-green-600');
            statusDisplay.classList.remove('text-red-600', 'text-yellow-600', 'text-green-600', 'text-gray-800');
            
            // Set default styling
            statusDisplay.classList.add('primary-text');
            statusContainer.classList.add('bg-gray-50', 'border-[var(--color-dark-green)]');


            if (!selectedNumber) {
                statusDisplay.textContent = 'Awaiting Selection...';
                return;
            }

            // Find the corresponding data entry (assuming first match is enough)
            const entry = tuitionData.find(item => item['Tuition Number'] === selectedNumber);

            if (entry) {
                const status = entry['Status'] ? entry['Status'].toUpperCase().trim() : 'UNKNOWN';
                
                statusDisplay.textContent = status;
                
                // Reset styling classes for status display
                statusContainer.className = 'mt-10 p-5 rounded-xl border-l-8 shadow-xl';
                statusDisplay.className = 'text-3xl font-extrabold mt-2 transition duration-300';
                
                if (status.includes('ACTIVE') || status.includes('PAID') || status.includes('CURRENT')) {
                    statusContainer.classList.add('bg-green-50', 'border-green-600');
                    statusDisplay.classList.add('text-green-600');
                } else if (status.includes('PENDING') || status.includes('REVIEW')) {
                    statusContainer.classList.add('bg-yellow-50', 'border-yellow-600');
                    statusDisplay.classList.add('text-yellow-600');
                } else if (status.includes('OVERDUE') || status.includes('CANCELED') || status.includes('TERMINATED')) {
                    statusContainer.classList.add('bg-red-50', 'border-red-600');
                    statusDisplay.classList.add('text-red-600');
                } else {
                    // Default styling for unknown/other statuses
                    statusContainer.classList.add('bg-gray-50', 'border-gray-500');
                    statusDisplay.classList.add('text-gray-800');
                }
            } else {
                statusDisplay.textContent = 'Status Not Found';
                statusContainer.classList.add('bg-red-50', 'border-red-600');
                statusDisplay.classList.add('text-red-600');
            }
        }

        // Start the application when the window loads
        window.onload = initApp;

    </script>
</body>
</html>
